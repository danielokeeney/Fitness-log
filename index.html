<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitTrack</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiRml0VHJhY2siLCJzaG9ydF9uYW1lIjoiRml0VHJhY2siLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBBMEQwRiIsInRoZW1lX2NvbG9yIjoiIzBBMEQwRiJ9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D0F;
    --surface:#12171A;
    --line:#212A2E;
    --ink:#E8ECEE;
    --ink-dim:#5C6A70;
    --lime:#B6E62E;
    --steps:#E8A13A;
    --kcal:#E8446B;
    --run:#3E9BE8;
    --gym2:#9C6EE6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Mono',monospace;
    min-height:100vh;
    padding:0 0 70px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 0;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .range{font-size:11px;letter-spacing:0.1em;color:var(--ink-dim);text-transform:uppercase;}
  .brand{font-size:26px;font-weight:700;letter-spacing:0.01em;margin-top:4px;}
  .brand .hi{color:var(--lime);}
  .stats{display:flex;gap:18px;align-items:center;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .n.lime{color:var(--lime);}
  .stat .l{font-size:9px;letter-spacing:0.1em;color:var(--ink-dim);text-transform:uppercase;text-align:center;}

  .progress-row{display:flex;align-items:center;gap:10px;margin:6px 0 18px;}
  .progress-label{font-size:10px;letter-spacing:0.1em;color:var(--ink-dim);text-transform:uppercase;white-space:nowrap;}
  .progress-track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--lime),var(--steps));}
  .progress-count{font-size:10px;color:var(--ink-dim);white-space:nowrap;}

  .weektabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;}
  .weektabs::-webkit-scrollbar{display:none;}
  .weektab{flex:0 0 auto;padding:8px 14px 10px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-dim);}
  .weektab .w{font-size:13px;font-weight:700;}
  .weektab .d{font-size:9px;letter-spacing:0.06em;}
  .weektab.active{color:var(--lime);border-bottom-color:var(--lime);}

  .tablewrap{overflow-x:auto;margin-top:2px;}
  table{border-collapse:collapse;width:100%;min-width:640px;}
  th{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);text-align:center;padding:14px 6px 8px;font-weight:400;}
  th .icon{display:block;font-size:16px;margin-bottom:4px;}
  th.weight{color:var(--lime);}
  th.steps{color:var(--steps);}
  th.kcal{color:var(--kcal);}
  th.run{color:var(--run);}
  th.gym{color:var(--gym2);}
  td{text-align:center;padding:8px 6px;font-size:14px;border-bottom:1px solid var(--line);}
  td.dcell{text-align:left;font-size:11px;color:var(--ink-dim);white-space:nowrap;}
  td.dcell .dow{color:var(--ink);font-size:13px;display:block;}

  .cell-input{
    width:100%;max-width:78px;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--ink);font-family:'Space Mono',monospace;font-size:14px;text-align:center;padding:4px 2px;
  }
  .cell-input:focus{outline:none;border-bottom-color:var(--lime);}
  td.col-weight .cell-input{color:var(--lime);border-bottom-color:rgba(182,230,46,0.3);}
  td.col-steps .cell-input{color:var(--steps);border-bottom-color:rgba(232,161,58,0.3);}
  td.col-kcal .cell-input{color:var(--kcal);border-bottom-color:rgba(232,68,107,0.3);}
  td.col-run .cell-input{color:var(--run);border-bottom-color:rgba(62,155,232,0.3);}
  .gym-check{width:20px;height:20px;accent-color:var(--gym2);}

  tr.avgrow td{padding-top:16px;font-weight:700;font-size:15px;border-bottom:none;border-top:1px solid var(--line);}
  tr.avgrow td.dcell{font-size:11px;letter-spacing:0.08em;color:var(--ink-dim);}
  tr.avgrow .unit{font-size:10px;font-weight:400;color:var(--ink-dim);margin-left:2px;}
  tr.avgrow .val-weight{color:var(--lime);}
  tr.avgrow .val-steps{color:var(--steps);}
  tr.avgrow .val-kcal{color:var(--kcal);}
  tr.avgrow .val-run{color:var(--run);}
  tr.avgrow .val-gym{color:var(--gym2);}

  /* OVERVIEW (week-on-week averages grid) */
  .metric-toggle{display:flex;gap:8px;margin:0 0 16px;}
  .metric-btn{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);
    padding:9px 6px;border-radius:5px;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;
  }
  .metric-btn.active{color:var(--bg);}
  .metric-btn.active[data-metric="weight"]{background:var(--lime);border-color:var(--lime);}
  .metric-btn.active[data-metric="steps"]{background:var(--steps);border-color:var(--steps);}
  .metric-btn.active[data-metric="calories"]{background:var(--kcal);border-color:var(--kcal);}

  .metric-header{display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .metric-header .icon{font-size:22px;}
  .metric-header .name{font-size:15px;font-weight:700;}
  .metric-header .unit{font-size:11px;color:var(--ink-dim);}

  .weekgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .weekcard{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:16px 10px;text-align:center;
  }
  .weekcard.current{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset;}
  .weekcard .wk{font-size:12px;color:var(--ink-dim);letter-spacing:0.05em;}
  .weekcard .avgval{font-size:26px;font-weight:700;margin:6px 0 2px;color:var(--ink-dim);}
  .weekcard.has-data .avgval{color:var(--ink);}
  .weekcard.current .avgval{color:var(--lime);}
  .weekcard .dm{font-size:10px;color:var(--ink-dim);}

  /* LOG intro card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px;font-size:12px;color:var(--ink-dim);line-height:1.5;}
  .card b{color:var(--ink);}

  .view{display:none;}
  .view.active{display:block;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .navbtn{flex:1;text-align:center;padding:12px 0 10px;background:none;border:none;color:var(--ink-dim);font-family:'Space Mono',monospace;cursor:pointer;}
  .navbtn .ic{display:block;font-size:18px;margin-bottom:2px;}
  .navbtn .lb{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;}
  .navbtn.active{color:var(--lime);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="range" id="rangeLabel"></div>
      <div class="brand">FIT<span class="hi">TRACK</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n lime" id="statEntries">0</div><div class="l">Entries</div></div>
      <div class="stat"><div class="n" id="statPct">0%</div><div class="l">Logged</div></div>
    </div>
  </div>
  <div class="progress-row">
    <div class="progress-label">Progress</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-count" id="progressCount">0 / 0</div>
  </div>
</div>

<!-- LOG VIEW: week-by-week editable table -->
<div id="logView" class="view active">
  <div class="wrap" style="padding-top:0;">
    <div class="weektabs" id="weekTabsLog"></div>
  </div>
  <div class="wrap" style="padding-top:8px;">
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th style="text-align:left;">Date</th>
            <th class="weight"><span class="icon">⚖</span>Weight<br><span style="font-weight:400;">kg</span></th>
            <th class="steps"><span class="icon">👟</span>Steps</th>
            <th class="kcal"><span class="icon">🔥</span>Kcal</th>
            <th class="run"><span class="icon">🏃</span>KM Ran</th>
            <th class="gym"><span class="icon">💪</span>Gym</th>
          </tr>
        </thead>
        <tbody id="logTableBody"></tbody>
        <tfoot>
          <tr class="avgrow">
            <td class="dcell">WK AVG</td>
            <td class="val-weight" id="avgWeight">—</td>
            <td class="val-steps" id="avgSteps">—</td>
            <td class="val-kcal" id="avgKcal">—</td>
            <td class="val-run" id="totalRun">—</td>
            <td class="val-gym" id="totalGym">—</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>

<!-- COMPARE VIEW: week-on-week average overview -->
<div id="compareView" class="view">
  <div class="wrap" style="padding-top:0;">
    <div class="metric-toggle">
      <button class="metric-btn active" data-metric="weight">Weight</button>
      <button class="metric-btn" data-metric="steps">Steps</button>
      <button class="metric-btn" data-metric="calories">Calories</button>
    </div>
    <div class="metric-header">
      <span class="icon" id="metricIcon">⚖</span>
      <span class="name" id="metricName">Weight</span>
      <span class="unit" id="metricUnit">kg</span>
    </div>
    <div class="weekgrid" id="weekGrid"></div>
  </div>
</div>

<div class="bottomnav">
  <button class="navbtn active" id="navLog" data-view="logView">
    <span class="ic">📋</span><span class="lb">Log</span>
  </button>
  <button class="navbtn" id="navCompare" data-view="compareView">
    <span class="ic">📊</span><span class="lb">Compare</span>
  </button>
</div>

<script>
const STORAGE_KEY = 'fitness-log-entries';
const START_DATE = '2026-07-27';

function todayStr(){ return new Date().toISOString().slice(0,10); }
function parseISO(iso){ return new Date(iso + 'T00:00:00'); }
function toISO(d){ return d.toISOString().slice(0,10); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function fmtDay(iso){ return parseISO(iso).toLocaleDateString('en-GB',{weekday:'short'}); }
function fmtDM(iso){ return parseISO(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function mondayOf(iso){
  const d = parseISO(iso);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate()+diff);
  return toISO(d);
}

document.getElementById('rangeLabel').textContent = 'Tracking from ' + fmtDM(START_DATE);

function loadEntries(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveEntries(entries){ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
function entryByDate(date){
  return loadEntries().find(e => e.date === date) || null;
}
function upsertField(date, field, value){
  const entries = loadEntries();
  const idx = entries.findIndex(e => e.date === date);
  if(idx > -1){
    entries[idx][field] = value;
  } else {
    const entry = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), date,
      weight:null, steps:null, calories:null, runDistance:null, gym:false };
    entry[field] = value;
    entries.push(entry);
  }
  // drop fully-empty entries (all fields null/false) to keep storage tidy
  const cleaned = entries.filter(e => !(e.weight==null && e.steps==null && e.calories==null && e.runDistance==null && !e.gym));
  saveEntries(cleaned);
}

let selectedWeekMonday = mondayOf(todayStr() < START_DATE ? START_DATE : todayStr());
let selectedMetric = 'weight';

function getAllWeekMondays(){
  const entries = loadEntries();
  const startMon = mondayOf(START_DATE);
  let lastDate = todayStr();
  entries.forEach(e => { if(e.date > lastDate) lastDate = e.date; });
  const endMon = mondayOf(lastDate);
  const weeks = [];
  let cur = startMon;
  while(cur <= endMon){ weeks.push(cur); cur = addDays(cur, 7); }
  if(weeks.length === 0) weeks.push(startMon);
  return weeks;
}

// ---------- LOG VIEW (week-by-week editable table) ----------
function renderWeekTabsLog(){
  const weeks = getAllWeekMondays();
  const tabsEl = document.getElementById('weekTabsLog');
  tabsEl.innerHTML = weeks.map((mon, i) => `
    <div class="weektab ${mon === selectedWeekMonday ? 'active' : ''}" data-mon="${mon}">
      <div class="w">W${i+1}</div>
      <div class="d">${fmtDM(mon)}</div>
    </div>`).join('');
  tabsEl.querySelectorAll('.weektab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedWeekMonday = tab.getAttribute('data-mon');
      renderLogTable();
    });
  });
  const activeTab = tabsEl.querySelector('.weektab.active');
  if(activeTab) activeTab.scrollIntoView({inline:'center', block:'nearest'});
}

function renderLogTable(){
  renderWeekTabsLog();
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(selectedWeekMonday, i));

  const body = document.getElementById('logTableBody');
  body.innerHTML = days.map(d => {
    const e = entryByDate(d);
    const v = (f) => (e && e[f] != null) ? e[f] : '';
    return `<tr>
      <td class="dcell"><span class="dow">${fmtDay(d)}</span>${fmtDM(d)}</td>
      <td class="col-weight"><input class="cell-input" type="number" step="0.1" inputmode="decimal" data-date="${d}" data-field="weight" value="${v('weight')}" placeholder="—"></td>
      <td class="col-steps"><input class="cell-input" type="number" step="1" inputmode="numeric" data-date="${d}" data-field="steps" value="${v('steps')}" placeholder="—"></td>
      <td class="col-kcal"><input class="cell-input" type="number" step="1" inputmode="numeric" data-date="${d}" data-field="calories" value="${v('calories')}" placeholder="—"></td>
      <td class="col-run"><input class="cell-input" type="number" step="0.1" inputmode="decimal" data-date="${d}" data-field="runDistance" value="${v('runDistance')}" placeholder="—"></td>
      <td><input class="gym-check" type="checkbox" data-date="${d}" data-field="gym" ${e && e.gym ? 'checked' : ''}></td>
    </tr>`;
  }).join('');

  body.querySelectorAll('input.cell-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const val = inp.value === '' ? null : parseFloat(inp.value);
      upsertField(inp.getAttribute('data-date'), inp.getAttribute('data-field'), val);
      renderAll();
    });
  });
  body.querySelectorAll('input.gym-check').forEach(inp => {
    inp.addEventListener('change', () => {
      upsertField(inp.getAttribute('data-date'), 'gym', inp.checked);
      renderAll();
    });
  });

  const weekEntries = days.map(d => entryByDate(d)).filter(Boolean);
  const weights = weekEntries.filter(e => e.weight != null).map(e => e.weight);
  const steps = weekEntries.filter(e => e.steps != null).map(e => e.steps);
  const cals = weekEntries.filter(e => e.calories != null).map(e => e.calories);
  const runs = weekEntries.filter(e => e.runDistance != null).map(e => e.runDistance);
  const gymCount = weekEntries.filter(e => e.gym).length;
  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length) : null;

  document.getElementById('avgWeight').innerHTML = weights.length ? avg(weights).toFixed(1) + '<span class="unit">kg</span>' : '—';
  document.getElementById('avgSteps').innerHTML = steps.length ? Math.round(avg(steps)) : '—';
  document.getElementById('avgKcal').innerHTML = cals.length ? Math.round(avg(cals)) + '<span class="unit">cal</span>' : '—';
  document.getElementById('totalRun').innerHTML = runs.length ? runs.reduce((a,b)=>a+b,0).toFixed(1) + '<span class="unit">km</span>' : '—';
  document.getElementById('totalGym').innerHTML = weekEntries.length ? gymCount + '<span class="unit">/' + weekEntries.length + '</span>' : '—';
}

// ---------- COMPARE VIEW (week-on-week averages grid) ----------
const METRIC_META = {
  weight:   { icon:'⚖',  name:'Weight',   unit:'kg',  field:'weight' },
  steps:    { icon:'👟', name:'Steps',    unit:'',    field:'steps' },
  calories: { icon:'🔥', name:'Calories', unit:'cal', field:'calories' }
};

function renderCompareGrid(){
  const meta = METRIC_META[selectedMetric];
  document.getElementById('metricIcon').textContent = meta.icon;
  document.getElementById('metricName').textContent = meta.name;
  document.getElementById('metricUnit').textContent = meta.unit;

  const weeks = getAllWeekMondays();
  const entries = loadEntries();
  const curWeekMon = mondayOf(todayStr());

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = weeks.map((mon, i) => {
    const weekDays = [];
    for(let d=0; d<7; d++) weekDays.push(addDays(mon, d));
    const vals = entries.filter(e => weekDays.includes(e.date) && e[meta.field] != null).map(e => e[meta.field]);
    const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    const isCurrent = mon === curWeekMon;
    const displayVal = avg == null ? '—' : (meta.field === 'weight' ? avg.toFixed(1) : Math.round(avg));
    return `<div class="weekcard ${isCurrent ? 'current' : ''} ${avg != null ? 'has-data' : ''}">
      <div class="wk">W${i+1}</div>
      <div class="avgval">${displayVal}</div>
      <div class="dm">${fmtDM(mon)}</div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.metric-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMetric = btn.getAttribute('data-metric');
    renderCompareGrid();
  });
});

// ---------- TOP STATS ----------
function renderStats(){
  const entries = loadEntries();
  document.getElementById('statEntries').textContent = entries.length;
  const start = parseISO(START_DATE);
  const today = parseISO(todayStr());
  const daysSoFar = Math.max(1, Math.round((today - start) / 86400000) + 1);
  const pct = Math.min(100, Math.round((entries.length / daysSoFar) * 100));
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = entries.length + ' / ' + daysSoFar;
}

function renderAll(){
  renderStats();
  renderLogTable();
  renderCompareGrid();
}

document.querySelectorAll('.navbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.getAttribute('data-view')).classList.add('active');
  });
});

renderAll();
</script>
</body>
</html>
