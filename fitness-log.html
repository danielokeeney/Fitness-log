<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FitTrack</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiRml0VHJhY2siLCJzaG9ydF9uYW1lIjoiRml0VHJhY2siLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBBMEQwRiIsInRoZW1lX2NvbG9yIjoiIzBBMEQwRiJ9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A2226;
    --surface:#232E33;
    --line:#3A484E;
    --ink:#F5F8F9;
    --ink-dim:#8FA0A7;
    --lime:#D4F236;
    --steps:#FFB648;
    --kcal:#FF5C82;
    --run:#4FB2FF;
    --gym2:#B285FF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Mono',monospace;
    min-height:100vh;
    padding:0 0 70px;
    overflow-x:hidden;
    width:100%;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 0;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .range{font-size:11px;letter-spacing:0.1em;color:var(--ink-dim);text-transform:uppercase;}
  .brand{font-size:26px;font-weight:700;letter-spacing:0.01em;margin-top:4px;}
  .brand .hi{color:var(--lime);}
  .stats{display:flex;gap:18px;align-items:center;}
  .stat .n{font-size:22px;font-weight:700;}
  .stat .n.lime{color:var(--lime);}
  .stat .l{font-size:9px;letter-spacing:0.1em;color:var(--ink-dim);text-transform:uppercase;text-align:center;}

  .progress-row{display:flex;align-items:center;gap:10px;margin:6px 0 18px;}
  .progress-label{font-size:10px;letter-spacing:0.1em;color:var(--ink-dim);text-transform:uppercase;white-space:nowrap;}
  .progress-track{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--lime),var(--steps));}
  .progress-count{font-size:10px;color:var(--ink-dim);white-space:nowrap;}

  /* week tabs - horizontal scroll is fine here, it's navigation not content */
  .weektabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .weektabs::-webkit-scrollbar{display:none;}
  .weektab{flex:0 0 auto;padding:8px 12px 10px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-dim);}
  .weektab .w{font-size:12px;font-weight:700;}
  .weektab .d{font-size:9px;letter-spacing:0.04em;}
  .weektab.active{color:var(--lime);border-bottom-color:var(--lime);}

  /* LOG: vertical day cards, no horizontal scroll */
  .daycard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;}
  .daycard-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .daycard-head .dow{font-size:14px;font-weight:700;}
  .daycard-head .ddate{font-size:11px;color:var(--ink-dim);}
  .daycard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .field label{font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);display:flex;gap:4px;align-items:center;}
  .field label .ic{font-size:11px;}
  input[type=number]{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    padding:8px 8px;border-radius:4px;font-family:'Space Mono',monospace;font-size:14px;min-width:0;
  }
  input:focus{outline:2px solid var(--lime);outline-offset:1px;}
  .field.weight input{color:var(--lime);}
  .field.steps input{color:var(--steps);}
  .field.kcal input{color:var(--kcal);}
  .field.run input{color:var(--run);}
  .checkbox{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;cursor:pointer;}
  .checkbox input{position:absolute;opacity:0;width:1px;height:1px;}
  .box{width:18px;height:18px;border:1px solid var(--ink-dim);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .checkbox input:checked + .box{background:var(--gym2);border-color:var(--gym2);}
  .checkbox input:checked + .box::after{content:'✓';font-size:12px;color:var(--bg);}
  .checkbox span.txt{font-size:12px;}

  .avgcard{background:var(--surface);border:1px solid var(--lime);border-radius:8px;padding:14px;margin-top:14px;}
  .avgcard-title{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;}
  .avgrow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;}
  .avgitem{text-align:center;}
  .avgitem .lbl{font-size:9px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-dim);}
  .avgitem .v{font-size:17px;font-weight:700;margin-top:2px;}
  .avgitem.weight .v{color:var(--lime);}
  .avgitem.steps .v{color:var(--steps);}
  .avgitem.kcal .v{color:var(--kcal);}
  .avgrow-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .avgitem.run .v{color:var(--run);}
  .avgitem.gym .v{color:var(--gym2);}

  /* COMPARE: week-on-week averages grid */
  .metric-toggle{display:flex;gap:8px;margin:0 0 16px;}
  .metric-btn{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);padding:9px 6px;border-radius:5px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;}
  .metric-btn.active{color:var(--bg);}
  .metric-btn.active[data-metric="weight"]{background:var(--lime);border-color:var(--lime);}
  .metric-btn.active[data-metric="steps"]{background:var(--steps);border-color:var(--steps);}
  .metric-btn.active[data-metric="calories"]{background:var(--kcal);border-color:var(--kcal);}

  .metric-header{display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .metric-header .icon{font-size:22px;}
  .metric-header .name{font-size:15px;font-weight:700;}
  .metric-header .unit{font-size:11px;color:var(--ink-dim);}

  .weekgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .weekcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 10px;text-align:center;}
  .weekcard.current{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset;}
  .weekcard .wk{font-size:12px;color:var(--ink-dim);letter-spacing:0.05em;}
  .weekcard .avgval{font-size:24px;font-weight:700;margin:6px 0 2px;color:var(--ink-dim);}
  .weekcard.has-data .avgval{color:var(--ink);}
  .weekcard.current .avgval{color:var(--lime);}
  .weekcard .dm{font-size:10px;color:var(--ink-dim);}

  .view{display:none;}
  .view.active{display:block;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .navbtn{flex:1;text-align:center;padding:12px 0 10px;background:none;border:none;color:var(--ink-dim);font-family:'Space Mono',monospace;cursor:pointer;}
  .navbtn .ic{display:block;font-size:18px;margin-bottom:2px;}
  .navbtn .lb{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;}
  .navbtn.active{color:var(--lime);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="range" id="rangeLabel"></div>
      <div class="brand">FIT<span class="hi">TRACK</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n lime" id="statEntries">0</div><div class="l">Entries</div></div>
      <div class="stat"><div class="n" id="statPct">0%</div><div class="l">Logged</div></div>
    </div>
  </div>
  <div class="progress-row">
    <div class="progress-label">Progress</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-count" id="progressCount">0 / 0</div>
  </div>
</div>

<!-- LOG VIEW: week-by-week, day cards, no horizontal scroll -->
<div id="logView" class="view active">
  <div class="wrap" style="padding-top:0;">
    <div class="weektabs" id="weekTabsLog"></div>
  </div>
  <div class="wrap" style="padding-top:12px;">
    <div id="dayCards"></div>
    <div class="avgcard">
      <div class="avgcard-title">Week average</div>
      <div class="avgrow-grid">
        <div class="avgitem weight"><div class="lbl">Weight</div><div class="v" id="avgWeight">—</div></div>
        <div class="avgitem steps"><div class="lbl">Steps</div><div class="v" id="avgSteps">—</div></div>
        <div class="avgitem kcal"><div class="lbl">Calories</div><div class="v" id="avgKcal">—</div></div>
      </div>
      <div class="avgrow-grid2">
        <div class="avgitem run"><div class="lbl">KM Ran (total)</div><div class="v" id="totalRun">—</div></div>
        <div class="avgitem gym"><div class="lbl">Gym sessions</div><div class="v" id="totalGym">—</div></div>
      </div>
    </div>
  </div>
</div>

<!-- COMPARE VIEW: week-on-week average overview -->
<div id="compareView" class="view">
  <div class="wrap" style="padding-top:0;">
    <div class="metric-toggle">
      <button class="metric-btn active" data-metric="weight">Weight</button>
      <button class="metric-btn" data-metric="steps">Steps</button>
      <button class="metric-btn" data-metric="calories">Calories</button>
    </div>
    <div class="metric-header">
      <span class="icon" id="metricIcon">⚖</span>
      <span class="name" id="metricName">Weight</span>
      <span class="unit" id="metricUnit">kg</span>
    </div>
    <div class="weekgrid" id="weekGrid"></div>
  </div>
</div>

<div class="bottomnav">
  <button class="navbtn active" id="navLog" data-view="logView">
    <span class="ic">📋</span><span class="lb">Log</span>
  </button>
  <button class="navbtn" id="navCompare" data-view="compareView">
    <span class="ic">📊</span><span class="lb">Compare</span>
  </button>
</div>

<script>
const STORAGE_KEY = 'fitness-log-entries';
const START_DATE = '2026-07-27'; // Monday
const WEEKS_COUNT = 12;

function todayStr(){ return toISO(new Date()); }
function parseISO(iso){ return new Date(iso + 'T00:00:00'); }
function toISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function fmtDay(iso){ return parseISO(iso).toLocaleDateString('en-GB',{weekday:'short'}); }
function fmtDM(iso){ return parseISO(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function mondayOf(iso){
  const d = parseISO(iso);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate()+diff);
  return toISO(d);
}

const ALL_WEEKS = (() => {
  const weeks = [];
  let cur = START_DATE;
  for(let i=0;i<WEEKS_COUNT;i++){ weeks.push(cur); cur = addDays(cur, 7); }
  return weeks;
})();
const LAST_WEEK_END = addDays(ALL_WEEKS[ALL_WEEKS.length-1], 6);

document.getElementById('rangeLabel').textContent = fmtDM(START_DATE) + ' \u2192 ' + fmtDM(LAST_WEEK_END);

function loadEntries(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveEntries(entries){ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
function entryByDate(date){ return loadEntries().find(e => e.date === date) || null; }
function upsertField(date, field, value){
  const entries = loadEntries();
  const idx = entries.findIndex(e => e.date === date);
  if(idx > -1){
    entries[idx][field] = value;
  } else {
    const entry = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), date,
      weight:null, steps:null, calories:null, runDistance:null, gym:false };
    entry[field] = value;
    entries.push(entry);
  }
  const cleaned = entries.filter(e => !(e.weight==null && e.steps==null && e.calories==null && e.runDistance==null && !e.gym));
  saveEntries(cleaned);
}

let selectedWeekMonday = (() => {
  const tw = mondayOf(todayStr());
  if(tw < ALL_WEEKS[0]) return ALL_WEEKS[0];
  if(tw > ALL_WEEKS[ALL_WEEKS.length-1]) return ALL_WEEKS[ALL_WEEKS.length-1];
  return ALL_WEEKS.includes(tw) ? tw : ALL_WEEKS[0];
})();
let selectedMetric = 'weight';

// ---------- LOG VIEW ----------
function renderWeekTabsLog(){
  const tabsEl = document.getElementById('weekTabsLog');
  tabsEl.innerHTML = ALL_WEEKS.map((mon, i) => `
    <div class="weektab ${mon === selectedWeekMonday ? 'active' : ''}" data-mon="${mon}">
      <div class="w">W${i+1}</div>
      <div class="d">${fmtDM(mon)}</div>
    </div>`).join('');
  tabsEl.querySelectorAll('.weektab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedWeekMonday = tab.getAttribute('data-mon');
      renderLog();
    });
  });
  const activeTab = tabsEl.querySelector('.weektab.active');
  if(activeTab) activeTab.scrollIntoView({inline:'center', block:'nearest'});
}

function renderLog(){
  renderWeekTabsLog();
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(selectedWeekMonday, i));

  const container = document.getElementById('dayCards');
  container.innerHTML = days.map(d => {
    const e = entryByDate(d);
    const v = (f) => (e && e[f] != null) ? e[f] : '';
    return `<div class="daycard">
      <div class="daycard-head"><span class="dow">${fmtDay(d)}</span><span class="ddate">${fmtDM(d)}</span></div>
      <div class="daycard-grid">
        <div class="field weight">
          <label><span class="ic">⚖</span>Weight (kg)</label>
          <input type="number" step="0.1" inputmode="decimal" data-date="${d}" data-field="weight" value="${v('weight')}" placeholder="—">
        </div>
        <div class="field steps">
          <label><span class="ic">👟</span>Steps</label>
          <input type="number" step="1" inputmode="numeric" data-date="${d}" data-field="steps" value="${v('steps')}" placeholder="—">
        </div>
        <div class="field kcal">
          <label><span class="ic">🔥</span>Calories</label>
          <input type="number" step="1" inputmode="numeric" data-date="${d}" data-field="calories" value="${v('calories')}" placeholder="—">
        </div>
        <div class="field run">
          <label><span class="ic">🏃</span>Run (km)</label>
          <input type="number" step="0.1" inputmode="decimal" data-date="${d}" data-field="runDistance" value="${v('runDistance')}" placeholder="—">
        </div>
      </div>
      <label class="checkbox">
        <input type="checkbox" data-date="${d}" data-field="gym" ${e && e.gym ? 'checked' : ''}>
        <span class="box"></span>
        <span class="txt">Gym session done</span>
      </label>
    </div>`;
  }).join('');

  container.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('change', () => {
      const val = inp.value === '' ? null : parseFloat(inp.value);
      upsertField(inp.getAttribute('data-date'), inp.getAttribute('data-field'), val);
      renderAll();
    });
  });
  container.querySelectorAll('input[type=checkbox]').forEach(inp => {
    inp.addEventListener('change', () => {
      upsertField(inp.getAttribute('data-date'), 'gym', inp.checked);
      renderAll();
    });
  });

  const weekEntries = days.map(d => entryByDate(d)).filter(Boolean);
  const weights = weekEntries.filter(e => e.weight != null).map(e => e.weight);
  const steps = weekEntries.filter(e => e.steps != null).map(e => e.steps);
  const cals = weekEntries.filter(e => e.calories != null).map(e => e.calories);
  const runs = weekEntries.filter(e => e.runDistance != null).map(e => e.runDistance);
  const gymCount = weekEntries.filter(e => e.gym).length;
  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length) : null;

  document.getElementById('avgWeight').textContent = weights.length ? avg(weights).toFixed(1) + ' kg' : '—';
  document.getElementById('avgSteps').textContent = steps.length ? Math.round(avg(steps)) : '—';
  document.getElementById('avgKcal').textContent = cals.length ? Math.round(avg(cals)) + ' cal' : '—';
  document.getElementById('totalRun').textContent = runs.length ? runs.reduce((a,b)=>a+b,0).toFixed(1) + ' km' : '—';
  document.getElementById('totalGym').textContent = weekEntries.length ? gymCount + ' / ' + weekEntries.length : '—';
}

// ---------- COMPARE VIEW ----------
const METRIC_META = {
  weight:   { icon:'⚖',  name:'Weight',   unit:'kg',  field:'weight' },
  steps:    { icon:'👟', name:'Steps',    unit:'',    field:'steps' },
  calories: { icon:'🔥', name:'Calories', unit:'cal', field:'calories' }
};

function renderCompareGrid(){
  const meta = METRIC_META[selectedMetric];
  document.getElementById('metricIcon').textContent = meta.icon;
  document.getElementById('metricName').textContent = meta.name;
  document.getElementById('metricUnit').textContent = meta.unit;

  const entries = loadEntries();
  const curWeekMon = mondayOf(todayStr());

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = ALL_WEEKS.map((mon, i) => {
    const weekDays = [];
    for(let d=0; d<7; d++) weekDays.push(addDays(mon, d));
    const vals = entries.filter(e => weekDays.includes(e.date) && e[meta.field] != null).map(e => e[meta.field]);
    const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    const isCurrent = mon === curWeekMon;
    const displayVal = avg == null ? '—' : (meta.field === 'weight' ? avg.toFixed(1) : Math.round(avg));
    return `<div class="weekcard ${isCurrent ? 'current' : ''} ${avg != null ? 'has-data' : ''}">
      <div class="wk">W${i+1}</div>
      <div class="avgval">${displayVal}</div>
      <div class="dm">${fmtDM(mon)}</div>
    </div>`;
  }).join('');
}

document.querySelectorAll('.metric-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.metric-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMetric = btn.getAttribute('data-metric');
    renderCompareGrid();
  });
});

// ---------- TOP STATS ----------
function renderStats(){
  const entries = loadEntries();
  document.getElementById('statEntries').textContent = entries.length;
  const start = parseISO(START_DATE);
  const today = parseISO(todayStr());
  const cappedToday = today > parseISO(LAST_WEEK_END) ? parseISO(LAST_WEEK_END) : today;
  const daysSoFar = Math.max(1, Math.round((cappedToday - start) / 86400000) + 1);
  const totalDays = WEEKS_COUNT * 7;
  const pct = Math.min(100, Math.round((entries.length / totalDays) * 100));
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = entries.length + ' / ' + totalDays;
}

function renderAll(){
  renderStats();
  renderLog();
  renderCompareGrid();
}

document.querySelectorAll('.navbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.getAttribute('data-view')).classList.add('active');
  });
});

renderAll();
</script>
</body>
</html>
