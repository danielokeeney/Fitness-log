<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Site Log — Fitness</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiU2l0ZSBMb2ciLCJzaG9ydF9uYW1lIjoiU2l0ZSBMb2ciLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzE0MTgxQyIsInRoZW1lX2NvbG9yIjoiIzE0MTgxQyJ9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181C;
    --surface:#1C2126;
    --line:#2A3138;
    --ink:#E8E3D8;
    --ink-dim:#9AA3AB;
    --amber:#C98A3E;
    --green:#5B8266;
    --danger:#B5544A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}
  header{margin-bottom:20px;}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
  }
  h1{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:28px;
    margin:6px 0 2px;
  }
  .subdate{color:var(--ink-dim);font-size:13px;font-family:'Space Mono',monospace;}

  .stamps{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:20px 0 24px;
  }
  .stamp{
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px 12px;
    background:var(--surface);
    position:relative;
  }
  .stamp::before{
    content:'';
    position:absolute;top:8px;right:8px;bottom:8px;left:8px;
    border:1px dashed rgba(232,227,216,0.12);
    pointer-events:none;
  }
  .stamp .label{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-dim);}
  .stamp .value{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;margin-top:4px;}
  .stamp.weight .value{color:var(--green);}
  .stamp.cal .value{color:var(--amber);}

  form{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px;
    margin-bottom:24px;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);}
  input[type=date],input[type=number]{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 10px;
    border-radius:3px;
    font-family:'Space Mono',monospace;
    font-size:14px;
  }
  input:focus,button:focus,.checkbox input:focus + .box{outline:2px solid var(--amber);outline-offset:1px;}
  .checkbox{
    display:flex;align-items:center;gap:10px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .checkbox input{position:absolute;opacity:0;width:1px;height:1px;}
  .box{
    width:18px;height:18px;border:1px solid var(--ink-dim);border-radius:3px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .checkbox input:checked + .box{background:var(--green);border-color:var(--green);}
  .checkbox input:checked + .box::after{content:'✓';font-size:12px;color:var(--bg);}
  .checkbox span.txt{font-size:13px;color:var(--ink);}

  button.submit{
    width:100%;
    background:var(--amber);
    color:#14181C;
    border:none;
    padding:11px;
    border-radius:3px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
  }
  button.submit:active{transform:translateY(1px);}

  .log-title{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 10px 2px;
    display:flex;justify-content:space-between;
  }
  .entry{
    display:grid;
    grid-template-columns:74px 1fr auto;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .d{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-dim);}
  .entry .tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;}
  .tag{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:2px;
    padding:2px 7px;
    font-family:'Space Mono',monospace;
  }
  .tag.w{color:var(--green);}
  .tag.c{color:var(--amber);}
  .tag.g{color:var(--ink);}
  .tag.r{color:var(--ink);}
  .del{
    background:none;border:none;color:var(--danger);
    font-size:16px;cursor:pointer;padding:4px 6px;line-height:1;
  }
  .empty{
    color:var(--ink-dim);
    font-size:13px;
    text-align:center;
    padding:30px 10px;
    border:1px dashed var(--line);
    border-radius:4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Daily site log</div>
    <h1>Fitness Log</h1>
    <div class="subdate" id="today"></div>
  </header>

  <div class="stamps">
    <div class="stamp weight">
      <div class="label">Avg weight</div>
      <div class="value" id="avgWeight">—</div>
    </div>
    <div class="stamp cal">
      <div class="label">Avg calories</div>
      <div class="value" id="avgCal">—</div>
    </div>
  </div>

  <form id="entryForm">
    <div class="field-row">
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" step="0.1" placeholder="—">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="runDistance">Run distance (km)</label>
        <input type="number" id="runDistance" step="0.1" placeholder="—">
      </div>
      <div class="field">
        <label for="calories">Calories</label>
        <input type="number" id="calories" step="1" placeholder="—">
      </div>
    </div>
    <label class="checkbox" for="gym">
      <input type="checkbox" id="gym">
      <span class="box"></span>
      <span class="txt">Gym session done</span>
    </label>
    <button type="submit" class="submit">Log entry</button>
  </form>

  <div class="log-title"><span>Entries</span><span id="count"></span></div>
  <div id="entries"></div>
</div>

<script>
const STORAGE_KEY = 'fitness-log-entries';
const startDateInput = document.getElementById('date');
const START_DATE = '2026-07-27';

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short' });
}

document.getElementById('today').textContent = 'Tracking from ' + fmtDate(START_DATE);
startDateInput.min = START_DATE;
startDateInput.value = todayStr() < START_DATE ? START_DATE : todayStr();

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveEntries(entries){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function render(){
  const entries = loadEntries().sort((a,b)=> b.date.localeCompare(a.date));
  const container = document.getElementById('entries');
  document.getElementById('count').textContent = entries.length ? entries.length + ' logged' : '';

  if(!entries.length){
    container.innerHTML = '<div class="empty">No entries yet. Log today\'s to start the sheet.</div>';
  } else {
    container.innerHTML = entries.map(e => {
      const tags = [];
      if(e.weight != null) tags.push(`<span class="tag w">${e.weight} kg</span>`);
      if(e.gym) tags.push(`<span class="tag g">Gym</span>`);
      if(e.runDistance != null) tags.push(`<span class="tag r">${e.runDistance} km run</span>`);
      if(e.calories != null) tags.push(`<span class="tag c">${e.calories} kcal</span>`);
      return `<div class="entry">
        <div class="d">${fmtDate(e.date)}</div>
        <div class="tags">${tags.join('') || '<span class="tag">No data</span>'}</div>
        <button class="del" data-id="${e.id}" aria-label="Delete entry">✕</button>
      </div>`;
    }).join('');
  }

  const weights = entries.filter(e => e.weight != null).map(e => e.weight);
  const cals = entries.filter(e => e.calories != null).map(e => e.calories);
  document.getElementById('avgWeight').textContent = weights.length
    ? (weights.reduce((a,b)=>a+b,0)/weights.length).toFixed(1) + ' kg'
    : '—';
  document.getElementById('avgCal').textContent = cals.length
    ? Math.round(cals.reduce((a,b)=>a+b,0)/cals.length) + ' kcal'
    : '—';

  container.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const remaining = loadEntries().filter(e => e.id !== id);
      saveEntries(remaining);
      render();
    });
  });
}

document.getElementById('entryForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const date = document.getElementById('date').value;
  if(!date) return;
  const weight = document.getElementById('weight').value;
  const runDistance = document.getElementById('runDistance').value;
  const calories = document.getElementById('calories').value;
  const gym = document.getElementById('gym').checked;

  const entries = loadEntries();
  const existingIdx = entries.findIndex(e => e.date === date);
  const entry = {
    id: existingIdx > -1 ? entries[existingIdx].id : (Date.now().toString(36)),
    date,
    weight: weight !== '' ? parseFloat(weight) : null,
    runDistance: runDistance !== '' ? parseFloat(runDistance) : null,
    calories: calories !== '' ? parseInt(calories,10) : null,
    gym
  };
  if(existingIdx > -1){ entries[existingIdx] = entry; } else { entries.push(entry); }
  saveEntries(entries);

  document.getElementById('weight').value = '';
  document.getElementById('runDistance').value = '';
  document.getElementById('calories').value = '';
  document.getElementById('gym').checked = false;
  render();
});

render();

if ('serviceWorker' in navigator) {
  // No-op registration placeholder for when this file is hosted (e.g. GitHub Pages)
  // with an accompanying sw.js for offline caching.
}
</script>
</body>
</html>
